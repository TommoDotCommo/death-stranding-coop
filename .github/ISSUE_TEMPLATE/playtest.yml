name: Playtest report
description: Tell us how a session went, including what worked.
labels: [playtest]
body:
  - type: markdown
    attributes:
      value: |
        Sessions that went well matter too: two PCs, real networks, long sessions and many players can only be
        checked by real players. Anything that broke also deserves its own bug report (with the diagnostics zip).
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: e.g. v0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Players and connection
      placeholder: e.g. 4 players on the group's server, two countries
    validations:
      required: true
  - type: input
    id: played
    attributes:
      label: What you played
      placeholder: e.g. Episode 3, deliveries around Port Knot City, about 90 minutes
    validations:
      required: true
  - type: checkboxes
    id: tried
    attributes:
      label: What you tried
      options:
        - label: Setup on a PC that never had the mod (Install, then Play)
        - label: Setup's Uninstall, then the game from Steam without co-op
        - label: Two PCs on different networks
        - label: Three or more players at once
        - label: Seeing each other, riding along (J), pings (B)
        - label: Structures one player built showing up for the others
        - label: An hour or more in one session
        - label: Rejoining after a crash or a dropped connection
  - type: textarea
    id: how
    attributes:
      label: How it went
      description: What worked, what felt off, lag, anything confusing in Setup or the launcher.
    validations:
      required: true
